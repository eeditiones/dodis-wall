<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150">
  <!-- Seven segments of the 'Grenzmauer 75' with the concrete pipe on top and loose, faded spray marks -->
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30333a"/>
      <stop offset="0.55" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#24272c"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#474b52"/>
      <stop offset="1" stop-color="#282b30"/>
    </linearGradient>
  </defs>
  <g fill="url(#slab)">
    <rect x="0" y="26" width="119" height="124"/>
    <rect x="120" y="26" width="119" height="124"/>
    <rect x="240" y="26" width="119" height="124"/>
    <rect x="360" y="26" width="119" height="124"/>
    <rect x="480" y="26" width="119" height="124"/>
    <rect x="600" y="26" width="119" height="124"/>
    <rect x="720" y="26" width="120" height="124"/>
  </g>
  <rect x="0" y="12" width="840" height="18" rx="9" fill="url(#pipe)"/>
  <rect x="0" y="13" width="840" height="2.5" fill="#5a5e66" opacity="0.55"/>
  <!-- spray marks: loose, irregular, low contrast -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.32">
    <path d="M22 98 c10 -30 30 -30 36 -6 s24 20 34 -8 s22 -26 40 4" stroke="#c8102e" stroke-width="7"/>
    <path d="M262 76 c18 -14 40 -10 44 6 c4 16 -22 22 -30 8 c-8 -14 16 -30 40 -18 c14 8 20 22 36 18" stroke="#f2c230" stroke-width="5"/>
    <path d="M498 112 l18 -46 l14 34 l20 -52 l16 44" stroke="#6cb4e4" stroke-width="6"/>
    <path d="M636 70 c-10 20 6 40 30 36 c26 -4 34 -30 14 -42 c-16 -10 -40 0 -36 20" stroke="#f3f0ea" stroke-width="4"/>
    <path d="M750 60 q20 30 60 12" stroke="#c8102e" stroke-width="5"/>
  </g>
  <g stroke-linecap="round" opacity="0.28">
    <path d="M58 96 v22" stroke="#c8102e" stroke-width="3"/>
    <path d="M92 94 v12" stroke="#c8102e" stroke-width="2.5"/>
    <path d="M306 86 v16" stroke="#f2c230" stroke-width="2.5"/>
    <path d="M530 100 v14" stroke="#6cb4e4" stroke-width="2.5"/>
    <path d="M790 72 v20" stroke="#c8102e" stroke-width="2.5"/>
  </g>
</svg>